name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly (08:30 UTC). Every conformance runner gates PRs at the pin;
    # upstream moving is the one thing a schedule can catch. Three jobs
    # run on it: nightly-upstream (the suites against upstream HEAD),
    # corpus-freshness (which pins are behind), and nightly-report (the
    # tracking issue for the first of those).
    - cron: "30 8 * * *"
  workflow_dispatch:

concurrency:
  # Cancel in-progress runs for the same ref when new commits land. Main
  # always runs to completion so release-please sees the final state.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job here only reads the repository: checkout, install, build,
# test. None writes a comment, a tag, a release, or an artifact, and
# none needs an OIDC token. Declaring the floor once at the top means a
# job added later starts read-only and has to opt into anything more,
# rather than silently inheriting whatever the repository default
# happens to be (CodeQL actions/missing-workflow-permissions).
# Publishing lives in release.yml, which declares its own wider scopes.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Type-aware lint (tsgolint) over shipped packages + their tests.
      # Kept separate from `pnpm lint`: it needs the oxlint-tsgolint binary
      # and runs a type checker, so it is slower than the syntactic pass.
      - run: pnpm lint:type-aware

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    # engines.node is ">=22"; exercise every supported major so we
    # catch version-specific regressions before consumers do.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  coverage:
    # Enforces the floors in vitest.config.ts; `vitest --coverage` exits
    # non-zero when a metric drops below its threshold. Its own job on a
    # single Node major rather than a step in the `test` matrix: the v8
    # instrumentation is the same code path on 22 and 24, so running it
    # twice buys nothing, and keeping it separate means a coverage dip
    # reads as a coverage failure instead of a test failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      # Advisory: the global thresholds average ~9400 statements, so
      # print the split a single number hides. It exits non-zero only when
      # coverage-summary.json is absent, which means `pnpm test:coverage`
      # above already failed before writing it, so in practice this step
      # never turns a passing job red. `if: always()` is so the split
      # still prints when a threshold fails.
      - name: coverage by package
        if: always()
        run: pnpm coverage:by-package

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  framework-tests:
    # Real-server integration tests for the express4 / express5 / fastify
    # adapters. Lives in an isolated pnpm root (framework-tests/) so the
    # framework runtimes stay out of the main workspace's lockfile and
    # dependabot's main-directory scan. See issue #295.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # Root install brings @types/express and fastify into
      # packages/oav-{express4,express5,fastify}/node_modules so tsc can
      # resolve the adapters' `import type { Request } from "express"` /
      # `from "fastify"` declarations when typechecking transitively from
      # framework-tests. The runtime express install lives only in
      # framework-tests/ (auto-install-peers=false in the root .npmrc
      # prevents the peer-dep declarations from pulling it back in).
      - run: pnpm install --frozen-lockfile
      - name: install framework-tests deps
        working-directory: framework-tests
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: framework-tests
        run: pnpm typecheck
      - name: test
        working-directory: framework-tests
        run: pnpm test

  conformance:
    # Every conformance runner, gating PRs. `suite` and `format-suite`
    # used to be nightly-only, on the grounds that the suite is ~1300
    # cases and its clone ~15 MB. Both halves of that are now false: the
    # pinned depth-1 fetch is 4.3 MB and the two runners take ~1s
    # combined, so a PR could regress the JSON Schema suite or the format
    # corpus and merge green while nobody found out until the morning.
    #
    # This job is the same set as `pnpm check` in conformance/, kept as
    # one step per runner so a failure names itself in the UI rather than
    # hiding inside a single script. Add a runner to both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: install conformance deps
        working-directory: conformance
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: conformance
        run: pnpm typecheck
      # Keyed on corpora.json, so the key changes exactly when a pin does.
      # On a hit `pnpm corpora` sees each checkout already at its pin and
      # returns without touching the network, which is the point: a
      # required check should not block on GitHub's git endpoints being
      # reachable. On a miss it fetches, and the save below warms the next
      # run. restore-keys makes a pin bump incremental: the previous
      # cache restores and `pnpm corpora` moves only the checkout that
      # drifted, instead of recloning ~225 MB. The path list is derived
      # from corpora.json so a fourth corpus cannot be silently absent
      # from the save while the key (hashed over the same file) pretends
      # it is covered.
      - name: derive corpus cache paths from corpora.json
        id: corpora-paths
        run: |
          {
            echo 'paths<<EOF'
            jq -r '.corpora | keys[] | "conformance/" + .' conformance/corpora.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: restore pinned corpora
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.corpora-paths.outputs.paths }}
          key: corpora-${{ hashFiles('conformance/corpora.json') }}
          restore-keys: corpora-
      - name: fetch any corpus the cache did not supply
        working-directory: conformance
        run: pnpm corpora
      - name: OpenAPI conformance cases
        working-directory: conformance
        run: pnpm openapi
      - name: JSON Schema suite (required)
        working-directory: conformance
        run: pnpm suite --check-baseline
      - name: format corpus (optional/format under an asserting dialect)
        working-directory: conformance
        run: pnpm format-suite --check-baseline
      - name: OpenAPI Overlay 1.0 suite
        working-directory: conformance
        run: pnpm overlay --check-baseline
      - name: JSON parser-conformance suite (stream-validator tokenizer)
        working-directory: conformance
        run: pnpm parse --check-baseline

  nightly-upstream:
    # The larger checks, run against upstream HEAD rather than the pin.
    # The PR gate answers "did this diff break anything"; the pin makes
    # that reproducible and hermetic. It cannot answer "does the code still
    # pass against what upstream has now", because the corpus it uses is
    # frozen by design. This job is that second question.
    #
    # It fetches HEAD and leaves corpora.json alone: bumping a pin stays a
    # reviewed commit rather than something a scheduled job does behind
    # you. `--floating` swaps the strict ratchet for the grew-vs-broke
    # classification in conformance/floating.ts, because against a moving
    # corpus "more failures than the baseline" has two very different
    # causes and a nightly that conflates them gets muted.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: install conformance deps
        working-directory: conformance
        run: pnpm install --frozen-lockfile
      # Only the corpus the floating steps below read. JSONTestSuite and
      # Overlay-Specification have no floating runner: the former is
      # effectively frozen upstream and the latter's churn rarely touches
      # its test fixtures, so their radar is corpus-freshness and their
      # measurement happens at the pin bump. Fetching them here (~220 MB,
      # nearly all JSONTestSuite) would be downloaded and discarded.
      - name: fetch the floating corpus at upstream HEAD
        working-directory: conformance
        run: pnpm corpora --latest JSON-Schema-Test-Suite
      - name: JSON Schema suite against upstream HEAD
        working-directory: conformance
        run: pnpm suite --check-baseline --floating
      - name: format corpus against upstream HEAD
        working-directory: conformance
        run: pnpm format-suite --check-baseline --floating
      - name: OpenAPI cases (corpus-independent, so pinned semantics hold)
        working-directory: conformance
        run: pnpm openapi

  nightly-report:
    # A failing scheduled workflow notifies almost nobody: GitHub mails
    # whoever last touched the cron, and that is easy to miss for months.
    # So the durable signal is an issue, opened once and updated after, kept
    # unique by its label so a fortnight of failures is one thread rather
    # than fourteen. Closed automatically when the nightly goes green again.
    #
    # Only nightly-upstream gates the issue. A pin being behind is the
    # expected state much of the time, so keying the issue on
    # corpus-freshness too would leave it permanently open and train
    # everyone to ignore the one thread a real regression lands in. The
    # freshness result rides along in the body as context instead.
    needs: [nightly-upstream, corpus-freshness]
    # not always(): a cancelled nightly is not a failed one, and must not
    # file a false alarm in the tracking issue.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.nightly-upstream.result }}
          FRESHNESS: ${{ needs.corpus-freshness.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="nightly-upstream"
          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$UPSTREAM" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "nightly-upstream is green again. Closing. ($RUN_URL)"
              gh issue close "$EXISTING"
            fi
            echo "nightly-upstream green; nothing to report"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "The nightly upstream run did not pass." \
            "" \
            "| job | result |" \
            "| --- | --- |" \
            "| \`nightly-upstream\` (suites against upstream HEAD) | $UPSTREAM |" \
            "| \`corpus-freshness\` (pins behind upstream) | $FRESHNESS |" \
            "" \
            "Logs: $RUN_URL" \
            "" \
            "Neither job blocks a pull request. \`nightly-upstream\` failing means a" \
            "unit regressed against a corpus that did not grow, which is ours rather" \
            "than upstream's; see conformance/floating.ts for how that is told apart." \
            "The \`corpus-freshness\` row is context only: a pin being behind is a" \
            "bump decision rather than a defect, and does not by itself open or" \
            "hold this issue open.")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "updated issue #$EXISTING"
          else
            gh issue create --label "$LABEL" \
              --title "Nightly upstream run is failing" --body "$BODY"
          fi

  corpus-freshness:
    # The pin in corpora.json makes the committed baselines reproducible.
    # On its own it would also make the corpora invisible: a frozen suite
    # means the runs above go green forever while upstream adds cases we
    # have never been measured against. This job is the other half. It
    # reports which pins are behind and what landed.
    #
    # Its own job on purpose. Being behind upstream is a maintenance
    # signal rather than a defect, and folding it into the runs above
    # would turn them red for a reason that is not a regression.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: install conformance deps
        working-directory: conformance
        run: pnpm install --frozen-lockfile
      - name: are the pinned corpora behind upstream?
        working-directory: conformance
        run: pnpm corpora:stale --fail-if-stale
      # Same class of signal: something we pinned may have moved upstream.
      # It lives here rather than in nightly-upstream so that a third
      # party republishing a metaschema, or spec.openapis.org being
      # unreachable, cannot read as a code regression or open the
      # tracking issue. Plain node, so it needs no install. `if: always()`
      # so a stale pin above does not mask a drift report.
      - name: have the vendored OpenAPI metaschemas changed under their pins?
        if: always()
        run: pnpm metaschema:stale

  pack-smoke:
    # Catches `exports` map / `files` / bundler regressions that unit
    # tests don't surface. Packs both publish tarballs
    # (`@oaverify/core` + `oaverify`), installs them into
    # fresh sandboxes, and imports each documented subpath.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No explicit `pnpm build`: each publishable package's prepack
      # rebuilds on `pnpm pack` below, so the explicit step is wasted
      # work. Builds still happen — just via prepack.
      - name: pack every publishable workspace package
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/packed"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed"
          (cd packages/oav && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/yaml && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/check && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/oav-express4 && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/oav-express5 && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/oav-fastify && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/stream-validator && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          ls -1 "$GITHUB_WORKSPACE/packed"
      - name: smoke-import @oaverify/core
        run: |
          set -euo pipefail
          CORE_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-core-*.tgz | head -n1)"
          rm -rf /tmp/smoke-core && mkdir -p /tmp/smoke-core && cd /tmp/smoke-core
          npm init -y > /dev/null
          npm install "$CORE_TGZ"
          cat > smoke.mjs <<'EOF'
          import { createValidator } from "@oaverify/core";
          import { compileSchema, jsonSchemaDialect } from "@oaverify/core/schema";
          import { createFileReader } from "@oaverify/core/spec";
          import { translateOverlay, applySpecOverlay } from "@oaverify/core/overlay-spec";
          const v = createValidator({
            openapi: "3.1.0",
            info: { title: "t", version: "1" },
            paths: {
              "/x": {
                post: {
                  requestBody: { required: true, content: { "application/json": { schema: { type: "object", required: ["a"] } } } },
                  responses: { "200": { description: "ok" } },
                },
              },
            },
          });
          const reqResult = v.validateRequest({ method: "POST", path: "/x", contentType: "application/json", body: {} });
          if (reqResult.valid) throw new Error("expected invalid (missing required 'a')");
          const { validate } = compileSchema({ type: "integer" }, { dialect: jsonSchemaDialect });
          if (!validate(42).valid) throw new Error("expected valid");
          // oav-core's JSON-only reader should refuse .yaml paths with an install-hint error.
          let threw = false;
          try {
            await createFileReader().read("dummy.yaml");
          } catch (e) {
            threw = /Install @oaverify\/yaml/.test(String(e?.message ?? ""));
          }
          if (!threw) throw new Error("expected oav-core's createFileReader to reject .yaml with an install hint");
          if (typeof translateOverlay !== "function") throw new Error("translateOverlay missing");
          if (typeof applySpecOverlay !== "function") throw new Error("applySpecOverlay missing");
          const overlay = translateOverlay({
            overlay: "1.0.0",
            info: { title: "t", version: "1" },
            actions: [{ target: "$.info", update: { description: "patched" } }],
          });
          if (!overlay.info || overlay.info.description !== "patched") {
            throw new Error("translateOverlay did not produce the expected info verb");
          }
          console.log("oav-core smoke ok");
          EOF
          node smoke.mjs
      - name: smoke @oaverify/yaml
        run: |
          set -euo pipefail
          CORE_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-core-*.tgz | head -n1)"
          YAML_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-yaml-*.tgz | head -n1)"
          rm -rf /tmp/smoke-yaml && mkdir -p /tmp/smoke-yaml && cd /tmp/smoke-yaml
          npm init -y > /dev/null
          npm install "$CORE_TGZ" "$YAML_TGZ"
          cat > smoke.mjs <<'EOF'
          import { composeReaders, createFileReader } from "@oaverify/core/spec";
          import { createSmartHttpReader, createYamlFileReader, loadSpecSync, parseYamlString } from "@oaverify/yaml";
          const parsed = parseYamlString("openapi: 3.1.0\ninfo: { title: t, version: '1' }\npaths: {}");
          if (parsed.openapi !== "3.1.0") throw new Error("parseYamlString regression");
          // The YAML readers must compose with oav-core's JSON-only ones.
          const reader = composeReaders([createYamlFileReader(), createSmartHttpReader(), createFileReader()]);
          if (!reader.canRead("spec.yaml") || !reader.canRead("spec.json")) {
            throw new Error("composed reader should claim both .yaml and .json");
          }
          if (typeof loadSpecSync !== "function") throw new Error("loadSpecSync missing");
          console.log("oaverify-yaml smoke ok");
          EOF
          node smoke.mjs
      - name: smoke @oaverify/check
        run: |
          set -euo pipefail
          CORE_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-core-*.tgz | head -n1)"
          CHECK_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-check-*.tgz | head -n1)"
          rm -rf /tmp/smoke-check && mkdir -p /tmp/smoke-check && cd /tmp/smoke-check
          npm init -y > /dev/null
          npm install "$CORE_TGZ" "$CHECK_TGZ"
          cat > smoke.mjs <<'EOF'
          import { CHECK_CLASSES, CHECK_SEVERITIES } from "@oaverify/check";
          if (!CHECK_CLASSES.includes("hygiene")) throw new Error("CHECK_CLASSES regression");
          if (CHECK_SEVERITIES[0] !== "warning") throw new Error("CHECK_SEVERITIES regression");
          console.log("oaverify-check smoke ok");
          EOF
          node smoke.mjs
      - name: smoke the oaverify CLI
        run: |
          set -euo pipefail
          # `oaverify` ships only the binary now; the library surface is
          # smoke-tested against @oaverify/core above. Install every
          # tarball it depends on so nothing resolves to the registry.
          CORE_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-core-*.tgz | head -n1)"
          YAML_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-yaml-*.tgz | head -n1)"
          SV_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-stream-*.tgz | head -n1)"
          CHECK_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-check-*.tgz | head -n1)"
          CLI_TGZ="$(ls "$GITHUB_WORKSPACE/packed"/oaverify-[0-9]*.tgz | head -n1)"
          rm -rf /tmp/smoke-cli && mkdir -p /tmp/smoke-cli && cd /tmp/smoke-cli
          npm init -y > /dev/null
          npm install "$CORE_TGZ" "$YAML_TGZ" "$SV_TGZ" "$CHECK_TGZ" "$CLI_TGZ"
          # The library surface must NOT be reachable from the CLI package.
          if node -e 'import("oaverify/schema").then(()=>process.exit(0),()=>process.exit(1))'; then
            echo "oaverify should not export a library surface" >&2
            exit 1
          fi
          npx oaverify --help > /dev/null
          # --version reads the installed package.json relative to the
          # bin, so this proves the path resolves inside the tarball
          # layout and not just in the repo (#518).
          INSTALLED="$(node -p "require('oaverify/package.json').version")"
          REPORTED="$(npx oaverify --version)"
          if [ "$INSTALLED" != "$REPORTED" ]; then
            echo "oaverify --version said '$REPORTED', installed version is '$INSTALLED'" >&2
            exit 1
          fi
          cat > spec.yaml <<'YAML'
          openapi: 3.1.0
          info: { title: t, version: "1" }
          paths:
            /x:
              post:
                requestBody:
                  required: true
                  content:
                    application/json:
                      schema: { type: object, required: [a] }
                responses:
                  "200": { description: ok }
          YAML
          # A YAML spec exercises the oaverify-yaml dependency through the
          # CLI's default reader chain.
          echo '{"a":1}' > ok.json
          echo '{}' > bad.json
          npx oaverify validate --path "POST /x" --body ok.json spec.yaml
          if npx oaverify validate --path "POST /x" --body bad.json spec.yaml > /dev/null 2>&1; then
            echo "expected a non-zero exit for the invalid body" >&2
            exit 1
          fi
          # stream-check imports analyzeSpec from @oaverify/stream, so this
          # fails if that dependency is missing or stale in the tree.
          npx oaverify stream-check spec.yaml > /dev/null
          # A report larger than the 64 KiB pipe buffer must survive being
          # piped. `process.exit` used to drop the tail and still exit 0,
          # so `check --format json | jq` got JSON that stopped mid-token
          # (#510). Only reproducible against a real pipe in a real
          # process, which is why it lives here and not in the unit tests.
          node -e '
            const s = {};
            for (let i = 0; i < 400; i += 1) s["Unused" + i] = { type: "object", properties: { f: { type: "string" } } };
            require("node:fs").writeFileSync("big.json", JSON.stringify({
              openapi: "3.0.3", info: { title: "t", version: "1.0.0" },
              paths: { "/ping": { get: { operationId: "ping", responses: { "200": { description: "ok" } } } } },
              components: { schemas: s },
            }));
          '
          npx oaverify check big.json --format json > direct.json
          npx oaverify check big.json --format json | cat > piped.json
          if ! cmp -s direct.json piped.json; then
            echo "piped report differs from the redirected one: $(wc -c < piped.json) vs $(wc -c < direct.json) bytes" >&2
            exit 1
          fi
          node -e 'JSON.parse(require("node:fs").readFileSync("piped.json","utf8"))'
