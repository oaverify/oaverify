name: release

# Two-stage flow driven by release-please:
#
# 1. Every push to main runs the `release-please` job. It scans commits
#    since the last release and either opens a "release" PR (bumping
#    package.json + appending to CHANGELOG.md) or updates the existing
#    one. No release is created until you merge that PR.
#
# 2. When the release PR is merged, release-please creates a GitHub
#    Release + git tag, sets `releases_created: true` in outputs, and
#    the `publish` job runs: installs, builds, and publishes the
#    tagged commit to npm.

on:
  push:
    branches: [main]
  # Manual trigger: re-fires the publish job for a specific release
  # tag. Use this to recover from a transient publish failure
  # (network, registry hiccup, trusted-publisher misconfiguration
  # on a single package). The publish loop checks the registry per
  # package and skips already-published versions, so retries are
  # safe even if some packages succeeded on the first attempt.
  #
  # The `tag` input is required and the publish job checks it out
  # explicitly: dispatch defaults to the workflow's branch HEAD, so
  # without a pinned ref a retry could publish newer code than the
  # release tag carries.
  workflow_dispatch:
    inputs:
      tag:
        # release-please creates one tag per package per release
        # (component prefix from release-please-config.json). The six
        # linked packages share a version, so their tags point at the same
        # commit; stream is unlinked (its own 1.x line) and carries its own
        # tag at its own commit. Pass whichever package's tag you are
        # republishing; core is the conventional choice for the linked
        # group.
        description: "Release tag to (re)publish, e.g. core-v4.0.0 or stream-v1.2.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Fires when release-please merges a release PR (tag + GitHub
    # Release just created), OR when this workflow is manually
    # dispatched (recovery from a partial / failed publish).
    # Regular pushes to main run release-please above but skip
    # publish — release-please's `releases_created` is `false` while
    # it's only updating the in-flight release PR. Note the plural: the
    # singular `release_created` is scoped to the ROOT component, so a
    # release that touches only an unlinked package (stream) would tag
    # but never publish.
    if: |
      needs.release-please.outputs.releases_created == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Validate the dispatch tag input before we use it as a ref.
      # The expected shape is <component>-v<MAJOR>.<MINOR>.<PATCH>
      # (release-please-config.json sets `include-component-in-tag:
      # true`). Reject anything else so a dispatcher can't pass
      # `main` or a SHA and end up publishing whatever happens to
      # be at that ref.
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^(core|oaverify|yaml|express4|express5|fastify|stream)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG'. Expected <component>-v<MAJOR>.<MINOR>.<PATCH>, e.g. core-v4.0.0"
            exit 1
          fi
      # Check out the exact release commit. On the auto path
      # (release-please created a release on this push),
      # github.sha already points at the merged release-PR commit
      # that release-please tagged. On workflow_dispatch, resolve
      # the input through `refs/tags/<name>` so a branch with the
      # same name as a release tag can't shadow the lookup; the
      # checkout action fails if the tag doesn't exist.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
      # Node 24 (not 22 as the rest of CI uses): bundles npm 11.6+,
      # which has the trusted-publisher OIDC exchange. Node 22 only
      # ships npm 10.9, no OIDC support.
      #
      # No dependency cache: npm trusted-publishing guidance is to
      # avoid caches in release builds to keep the supply-chain
      # surface minimal. `--frozen-lockfile` already pins versions;
      # the install time is acceptable for a once-per-release job.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          # No registry-url: setup-node would write an .npmrc that
          # pins auth to a NODE_AUTH_TOKEN env var, blocking npm's
          # native OIDC trusted-publisher flow. npm CLI picks the
          # registry up from its built-in default.
      - run: pnpm install --frozen-lockfile
      # Tests gate the publish (the per-package prepublishOnly gates
      # are bypassed by `npm publish <tarball>`, so run the suite here
      # explicitly).
      - run: pnpm test
      # Build tarballs with pnpm: it rewrites `workspace:*` deps to
      # real versions in the packed manifest (npm pack does not, hence
      # the per-package prepack guard that rejects npm pack). Each
      # package's prepack also rebuilds dist as a side effect.
      - name: Pack
        run: |
          mkdir -p pkgs
          for pkg in . packages/oav packages/yaml packages/oav-express4 packages/oav-express5 packages/oav-fastify packages/stream-validator; do
            (cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/pkgs")
          done
      # Publish via npm CLI, which performs the OIDC token exchange
      # with npm's trusted-publisher endpoint using the `id-token:
      # write` permission. No long-lived NPM_TOKEN secret involved.
      # Each package must be configured as a trusted publisher on
      # npmjs.com pointing at this repo + workflow.
      #
      # Trusted publishing automatically attaches Sigstore-signed
      # provenance to the published tarball, so `--provenance` is
      # not passed explicitly.
      #
      # The pre-publish `npm view` check makes the loop idempotent:
      # a workflow_dispatch retry after a partial publish skips
      # packages already on the registry instead of erroring. Exit
      # 0 from `npm view <pkg>@<version>` means the version exists;
      # exit 1 (E404) means it doesn't, so we publish.
      #
      # --access public: required the first time a scoped package
      # publishes; harmless afterwards.
      - name: Publish
        run: |
          set -euo pipefail
          npm --version
          # Dependency-first order. Glob order would publish the CLI FIRST:
          # tarball names flatten the scope, so `oaverify-4.0.0.tgz` sorts
          # ahead of `oaverify-core-4.0.0.tgz` ("4" < "c"). If the job then
          # died before the dependencies landed, `npm install oaverify` would
          # resolve to versions that do not exist on the registry. The retry
          # path recovers, but the broken window is public and avoidable.
          ORDER=(
            "oaverify-core-*.tgz"
            "oaverify-yaml-*.tgz"
            "oaverify-stream-*.tgz"
            "oaverify-express4-*.tgz"
            "oaverify-express5-*.tgz"
            "oaverify-fastify-*.tgz"
            "oaverify-[0-9]*.tgz"
          )
          seen=0
          for pattern in "${ORDER[@]}"; do
            for tarball in pkgs/$pattern; do
              if [ ! -e "$tarball" ]; then
                echo "::error::no tarball matched $pattern"
                exit 1
              fi
              seen=$((seen + 1))
              manifest=$(tar -xOf "$tarball" package/package.json)
              name=$(printf '%s' "$manifest" | jq -r .name)
              version=$(printf '%s' "$manifest" | jq -r .version)
              if npm view "${name}@${version}" version > /dev/null 2>&1; then
                echo "skip: ${name}@${version} already published"
                continue
              fi
              echo "publish: ${name}@${version}"
              # `./` prefix: without it npm parses a relative path containing
              # `/` as a github user/repo spec (e.g. `pkgs/oaverify-X.tgz` ->
              # github user `pkgs`, repo `oaverify-X.tgz`) and tries to
              # git-clone it, failing with code 128 before any OIDC exchange.
              npm publish --access public "./$tarball"
            done
          done
          # The ordered list is hand-maintained, so assert it covered
          # everything Pack produced. Without this, adding a package and
          # forgetting to list it here would silently skip publishing it.
          total=$(find pkgs -name '*.tgz' | wc -l | tr -d ' ')
          if [ "$seen" -ne "$total" ]; then
            echo "::error::publish order covered $seen tarballs but Pack produced $total"
            exit 1
          fi
